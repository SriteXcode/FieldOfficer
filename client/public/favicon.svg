<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="compassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Box -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#1e293b" stroke-width="8" />

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#compassGrad)" stroke-width="20" opacity="0.6" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#38bdf8" stroke-width="12" filter="url(#glow)" />

  <!-- Compass Needle -->
  <path d="M256 100 L310 240 L256 215 L202 240 Z" fill="url(#compassGrad)" />
  <path d="M256 412 L310 272 L256 297 L202 272 Z" fill="#1e293b" />

  <!-- Center Pin -->
  <circle cx="256" cy="256" r="24" fill="#38bdf8" />
  <circle cx="256" cy="256" r="10" fill="#ffffff" />
</svg>